###############################################
#   SkyFire Auth Server configuration file    #
###############################################
[authserver]
ConfVersion=2026090802

###################################################################################################
# SECTION INDEX
#
#    EXAMPLE CONFIG
#    AUTH SERVER SETTINGS
#    MYSQL SETTINGS
#    LOGGING SYSTEM SETTINGS
#
###################################################################################################

###################################################################################################
# EXAMPLE CONFIG
#
#    Variable
#        Description: Brief description what the variable is doing.
#        Important:   Annotation for important things about this variable.
#        Example:     "Example, i.e. if the value is a string"
#        Default:     10 - (Enabled|Comment|Variable name in case of grouped config options)
#                     0  - (Disabled|Comment|Variable name in case of grouped config options)
#
# Note to developers:
# - Copy this example to keep the formatting.
# - Line breaks should be at column 100.
###################################################################################################

###################################################################################################
# AUTH SERVER SETTINGS
#
#    LogsDir
#        Description: Logs directory setting.
#        Important:   LogsDir needs to be quoted, as the string might contain space characters.
#                     Logs directory must exists, or log file creation will be disabled.
#        Default:     "" - (Log files will be stored in the current path)

LogsDir = ""

#
#    MaxPingTime
#        Description: Time (in minutes) between database pings.
#        Default:     30

MaxPingTime = 30

#
#    RealmServerPort
#        Description: TCP port to reach the auth server.
#        Default:     3724

RealmServerPort = 3724

#
#
#    BindIP
#        Description: Bind auth server to IP/hostname
#        Default:     "0.0.0.0" - (Bind to all IPs on the system)

BindIP = "0.0.0.0"

#
#    Authnet.Enabled
#        Description: Enable the authnet listener for launcher-based login.
#                      The classic GRUNT listener (RealmServerPort/BindIP
#                      above) is unaffected either way.
#        Default:     0 - (Disabled)

Authnet.Enabled = 0

#
#    Authnet.VerboseLogging
#        Description: Enable verbose authnet protocol diagnostics, including connection activity,
#                     decoded packets, response scheduling, and encrypted payload details.
#        Important:   This output may contain account identities and protocol data. Enable only
#                     while diagnosing authnet behavior. Warnings and errors are always logged.
#        Default:     0 - (Disabled)

Authnet.VerboseLogging = 0

#
#    Authnet.AllowUnverifiedLogin
#        Description: Allows identity-only authnet sessions to receive a
#                     success response and world handoff token without a
#                     validated password proof.
#                     This is unsafe and only useful for local protocol
#                     research while the authnet proof flow is unfinished.
#        Default:     0 - (Disabled)

Authnet.AllowUnverifiedLogin = 0

#
#    Authnet.LoginGrantTTL
#        Description: Lifetime in seconds for a launcher-issued authnet login
#                     grant. The grant is one-use and must be consumed